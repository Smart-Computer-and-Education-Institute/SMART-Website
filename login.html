<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="LogIn" id="LogIn-form">
        <form class="login-form" id="loginForm">
            <h1>Login</h1>

            <div class="form-group" id="group-username">
                <label for="Username">Email</label>
                <input type="email" id="Username" name="Username" placeholder="Email" required>
                <span class="form-error" id="error-username"></span>
            </div>

            <div class="form-group" id="group-password">
                <label for="Password">Password</label>
                <input type="password" id="Password" name="Password" placeholder="Password" required>
                <span class="form-error" id="error-password"></span>
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox" id="rememberMe"> Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="login-btn">Login</button>
            <p class="form-error" id="error-general" style="text-align:center;"></p>
        </form>
    </section>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import {
            getAuth,
            signInWithEmailAndPassword,
            setPersistence,
            browserLocalPersistence,
            browserSessionPersistence
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // Your project's Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyDPW9bldB4sM48X1WBPjYtjyLawgUKWM88",
            authDomain: "smartcomputerandeducation.firebaseapp.com",
            projectId: "smartcomputerandeducation",
            storageBucket: "smartcomputerandeducation.firebasestorage.app",
            messagingSenderId: "924364544527",
            appId: "1:924364544527:web:c5a4663b8555bcace0617a",
            measurementId: "G-XE2MYDK27K"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById("loginForm");
        const usernameField = document.getElementById("Username");
        const passwordField = document.getElementById("Password");
        const errorGeneral = document.getElementById("error-general");
        const rememberMe = document.getElementById("rememberMe");

        form.addEventListener("submit", async (e) => {
            e.preventDefault(); // stop normal form POST — we handle it with JS instead

            errorGeneral.textContent = "";
            const email = usernameField.value.trim();
            const password = passwordField.value;

            try {
                // "Remember me" controls whether login persists after closing the browser
                await setPersistence(
                    auth,
                    rememberMe.checked ? browserLocalPersistence : browserSessionPersistence
                );

                await signInWithEmailAndPassword(auth, email, password);

                // Success -> redirect to admin panel
                window.location.href = "/admin.html";

            } catch (error) {
                errorGeneral.textContent = "Invalid email or password.";
                console.error(error.code, error.message);
            }
        });
    </script>

</body>

</html>
