<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="LogIn" id="LogIn-form">
        <form class="login-form" id="loginForm">
            <h1>Login</h1>

            <div class="form-group" id="group-username">
                <label for="Username">Email</label>
                <input type="email" id="Username" name="Username" placeholder="Email" required>
                <span class="form-error" id="error-username"></span>
            </div>

            <div class="form-group" id="group-password">
                <label for="Password">Password</label>
                <input type="password" id="Password" name="Password" placeholder="Password" required>
                <span class="form-error" id="error-password"></span>
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox" id="rememberMe"> Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="login-btn">Login</button>
            <p class="form-error" id="error-general" style="text-align:center;"></p>
        </form>
    </section>



</body>

</html>
